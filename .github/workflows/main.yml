name: Download Umittube Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install requests urllib3
    
    - name: Run umittube.py
      env:
        ENCRYPTED_PLAYLIST_URL: ${{ secrets.ENCRYPTED_PLAYLIST_URL }}
      run: |
        python umittube.py
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Umittube/
        git diff --quiet && git diff --staged --quiet || git commit -m "🔄 Update Umittube playlist [$(date +'%Y-%m-%d %H:%M:%S')]"
        git push
